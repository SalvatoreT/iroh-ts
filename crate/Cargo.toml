[package]
name = "iroh-ts"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
iroh = { version = "=1.0.0-rc.1", default-features = false, features = ["tls-ring"] }
iroh-blobs = { version = "0.102", default-features = false }
iroh-docs = { version = "0.100", default-features = false }
iroh-gossip = { version = "0.100", default-features = false, features = ["net"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
tokio = { version = "1", default-features = false, features = ["sync"] }

[profile.release]
opt-level = "s"
lto = true
